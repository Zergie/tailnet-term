[package]
name = "tailnet-term"
version = "0.1.1"
edition = "2024"

[dependencies]
crypto_box = { version = "0.9", default-features = false, features = ["salsa20", "alloc"] }
getrandom = "0.2"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
serde_json = "1"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
strip-ansi-escapes = "0.2"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", default-features = false }
anyhow = { version = "1", default-features = false }
blake2 = { version = "0.10", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom", "risky-raw-split"] }
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Foundation"] }

[features]
# Developer probe commands (control, relay, pty-check). Not part of release builds.
diagnostics = []
classic-pty = ["windows-sys/Win32_UI_Input_KeyboardAndMouse"]

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
